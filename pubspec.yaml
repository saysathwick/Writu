name: atelier
description: "U-write — a visual notes app where every note is a personal object."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^11.0.0
  file_picker: ^10.3.2
  flutter_staggered_grid_view: ^0.7.0
  collection: ^1.19.1
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.15.0
  speech_to_text: ^7.5.0
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  image_path: assets/branding/uwrite_icon.png
  adaptive_icon_background: "#F7F1E8"
  adaptive_icon_foreground: assets/branding/uwrite_icon.png
  adaptive_icon_foreground_inset: 18
